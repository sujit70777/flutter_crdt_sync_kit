name: flutter_sync_kit
description: >-
  An offline-first, CRDT-based local data layer for Flutter. Write while
  offline, merge automatically and conflict-free when back online, with
  pluggable Supabase and REST backend adapters.
version: 0.1.0
homepage: https://github.com/sujit70777/flutter_sync_kit
repository: https://github.com/sujit70777/flutter_sync_kit
issue_tracker: https://github.com/sujit70777/flutter_sync_kit/issues
topics:
  - offline-first
  - crdt
  - sync
  - database
  - supabase

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  uuid: ^4.5.1
  collection: ^1.19.0
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.27
  sqlite3: ^2.7.0
  path_provider: ^2.1.5
  path: ^1.9.0
  http: ^1.2.2
  supabase: ^2.6.0
  connectivity_plus: ^6.1.0
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter:
